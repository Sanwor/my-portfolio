<!DOCTYPE html>

  <style>
    /* Initial Flutter loading screen */
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 350ms ease,
        visibility 350ms ease;
    }

    #app-loader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .loader-logo {
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
      animation: logo-pulse 1.6s ease-in-out infinite;
    }

    .loader-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #a855f7;
      border-right-color: #7c3aed;
      border-radius: 50%;
      animation: loader-spin 0.85s linear infinite;
    }

    .loader-text {
      color: #a1a1aa;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      letter-spacing: 1.5px;
    }

    @keyframes loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logo-pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        transform: scale(0.97);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-logo,
      .loader-spinner {
        animation: none;
      }

     #app-loader {
       transition: none;
      }
    }
  </style>

  <!-- Hide the loader when Flutter renders its first frame -->

    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('app-loader');

      if (loader) {
        loader.classList.add('loaded');

    });
